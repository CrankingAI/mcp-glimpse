[project]
name = "mcp-glimpse"
version = "0.1.0"
description = "Point your agent at itself — see every MCP server, tool, capability, and the wire."
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bill Wilder", email = "codingoutloud@gmail.com" }]
dependencies = [
    "pydantic>=2.7",
    "mcp>=1.28",
]

[project.optional-dependencies]
azure = [
    "azure-data-tables>=12.5",
    "azure-identity>=1.17",
]

[project.scripts]
mcp-glimpse = "mcp_glimpse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_glimpse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
